# Shopfloor Sentinel on Fly.io – one always-on machine with a persistent disk.
# First deploy: ./deploy/fly-deploy.sh   Later deploys: fly deploy --ha=false
app = "shopfloor-sentinel"
primary_region = "sin" # Singapore, the closest Fly region to India

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  TRUST_PROXY = "1"
  COOKIE_SECURE = "true"
  SEED_DEMO = "false"
  DB_PATH = "/data/sentinel.db"
  UPLOADS_DIR = "/data/uploads"
  EMBEDDINGS_CACHE = "/data/models"

# SQLite, audio and the embedding model live on this volume and survive deploys.
[mounts]
  source = "sentinel_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  # Must stay running: escalations, the message queue and the 8 PM summary run in this process.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
